# Server - Render injects PORT env var
server.port=${PORT:8080}

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:cafenadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (disabled in production)
spring.h2.console.enabled=false

# CORS - comma-separated list of allowed origins (set ALLOWED_ORIGINS env var on Render)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# App name
spring.application.name=cafena-backend
